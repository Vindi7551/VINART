<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第三轮 · 边缘放大取景 + 组合容器裁切</title>
<style>
  html,body{margin:0;padding:0}
  body{background:#1e1e1e;font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#ddd;padding:22px 26px 40px}
  h2{font-size:15px;font-weight:600;margin:0 0 12px;color:#fff}
  .row{display:flex;gap:26px;margin-bottom:28px;align-items:flex-start}
  .cap{font-size:12px;color:#9a9a9a;margin-top:8px}
  .cap b{color:#fff}

  /* 放大框：显示照片某一角 + 框外底板，边缘落在框内 1/4 处 */
  .zoom{width:260px;height:195px;overflow:hidden;position:relative;background:#efe7d3;outline:1px solid #555}
  .zoom .inner{position:absolute;width:380px;height:285px;transform:scale(3);transform-origin:0 0}
  .zoom .inner img{width:380px;height:285px;object-fit:cover;display:block}
  /* 左上角：照片从 (26,20) 开始 */
  .zoom.tl .inner{top:20px;left:26px}
  /* 右下角：照片右下角落在 (200,150) 附近 */
  .zoom.br .inner{top:-98px;left:-92px}
  .zoom .inner img.masked{-webkit-mask-image:url(#maskA);mask-image:url(#maskA);
          -webkit-mask-size:380px 285px;mask-size:380px 285px;
          -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

  /* 组合容器整体裁切 */
  .scene{width:380px;height:285px;position:relative;background:#efe7d3;overflow:hidden}
  .group{position:absolute;inset:0;
         -webkit-mask-image:url(#maskF4);mask-image:url(#maskF4);
         -webkit-mask-size:380px 285px;mask-size:380px 285px;
         -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .group img{position:absolute;inset:0;width:380px;height:285px;object-fit:cover}
  .group .tag{position:absolute;left:14px;bottom:14px;background:#1c3a2a;color:#f3ead6;
              font:600 15px/1 "Segoe UI",sans-serif;padding:9px 14px;letter-spacing:.04em}
  .group .rule{position:absolute;left:14px;bottom:56px;width:150px;height:2px;background:#c8952f}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="roughA" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.019" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="maskA" maskUnits="userSpaceOnUse" x="-40" y="-40" width="460" height="365">
      <rect x="0" y="0" width="380" height="285" fill="#fff" filter="url(#roughA)"/>
    </mask>

    <filter id="rF4" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="3" seed="2" result="lo"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.35 0.008" numOctaves="3" seed="8" result="hi"/>
      <feDisplacementMap in="SourceGraphic" in2="lo" scale="26" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feDisplacementMap in="d1" in2="hi" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="maskF4" maskUnits="userSpaceOnUse" x="-40" y="-40" width="460" height="365">
      <rect x="0" y="0" width="380" height="285" fill="#fff" filter="url(#rF4)"/>
    </mask>
  </defs>
</svg>

<h2>① 3 倍放大后的边缘质量</h2>
<div class="row">
  <div class="cell">
    <div class="zoom tl"><div class="inner">
      <img class="masked" src="file:///D:/desktop/vinart/test_product/shirt/71R5FYOm25L._AC_SX522_.jpg" alt="">
    </div></div>
    <div class="cap"><b>Z1</b> 左上角 3x —— 米色底板与照片的交界</div>
  </div>
  <div class="cell">
    <div class="zoom br"><div class="inner">
      <img class="masked" src="file:///D:/desktop/vinart/test_product/shirt/71R5FYOm25L._AC_SX522_.jpg" alt="">
    </div></div>
    <div class="cap"><b>Z2</b> 右下角 3x —— 毛茬是否仍是矢量锐边</div>
  </div>
</div>

<h2>② 遮罩作用在「组合容器」上：照片 + 文字 + 装饰线一起被裁</h2>
<div class="row">
  <div class="cell">
    <div class="scene">
      <div class="group">
        <img src="file:///D:/desktop/vinart/test_product/shirt/71R5FYOm25L._AC_SX522_.jpg" alt="">
        <div class="rule"></div>
        <div class="tag">SCHNEIDEBRETT</div>
      </div>
    </div>
    <div class="cap"><b>C1</b> 一个 mask 同时裁照片 / 色块 / 文字 —— 版式层可用</div>
  </div>
  <div class="cell">
    <div class="scene">
      <div class="group">
        <img src="file:///D:/desktop/vinart/test_product/goose/source.jpg" alt="">
        <div class="tag">AKAZIENHOLZ</div>
      </div>
    </div>
    <div class="cap"><b>C2</b> 换图换比例 —— 同一遮罩无需重做</div>
  </div>
</div>

</body>
</html>
