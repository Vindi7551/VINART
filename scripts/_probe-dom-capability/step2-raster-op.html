<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent}
  canvas{display:block;width:420px;height:300px}
</style></head><body>
<canvas id="c" width="420" height="300"></canvas>
<script>
  // ② 光栅处理：对①烘焙出的位图做 DOM 做不到的两件事
  //   (a) 局部推挤变形（空间上变化的 warp —— CSS/SVG 的均匀 transform 给不了）
  //   (b) 笔刷盖章（软边圆点沿路径累积混合 —— 光栅画笔行为）
  const src = new Image();
  src.onload = () => {
    const c = document.getElementById('c'), g = c.getContext('2d');
    const W = 420, H = 300;

    // ── (a) 局部推挤：按"距中心的行距"决定水平位移，二次衰减 ──
    const cx = W * 0.60, cy = H * 0.52, R = W * 0.46, PUSH = 58;
    const steps = 200;
    for (let i = 0; i < steps; i++) {
      const y0 = H * i / steps, y1 = H * (i + 1) / steps, yc = (y0 + y1) / 2;
      const t = Math.max(0, 1 - Math.abs(yc - cy) / R);
      const off = t * t * PUSH;                       // 越靠中越推得多
      g.drawImage(src, 0, y0, W, y1 - y0, off, y0, W, y1 - y0);
    }

    // ── (b) 笔刷盖章：软边圆头，沿 S 形路径按变半径累积 ──
    const stamp = (x, y, r, col, a) => {
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, col); rg.addColorStop(0.65, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalAlpha = a; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
      g.fillStyle = rg; g.fill();
    };
    g.globalCompositeOperation = 'source-over';
    for (let i = 0; i <= 80; i++) {
      const t = i / 80;
      const x = 286 + 74 * Math.sin(t * Math.PI * 2.1);
      const y = 18 + t * 268;
      const r = 15 * (0.55 + 0.55 * Math.abs(Math.sin(i * 0.63)));  // 变半径 = 压感效果
      stamp(x, y, r, '#d23b3b', 0.40);
    }
    document.documentElement.setAttribute('data-done', '1');
  };
  src.src = 'dom-layer.png';
</script>
</body></html>
