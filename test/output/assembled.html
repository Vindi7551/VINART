<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7天焕亮你的光</title>
    <style>
        /* ===== 全局重置 & CSS 变量 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 色彩系统 tokens */
            --warm-beige-0: #F5E6D3;
            --warm-beige-1: #EED9C4;
            --blush-pink-0: #D8B4A0;
            --blush-pink-1: #C9A08C;
            --champagne-gold-0: #D4AF37;
            --champagne-gold-1: #E8C872;
            --soft-white: #FDF8F3;
            --pearlescent-0: #F2E6D8;
            --pearlescent-1: #FFF5EC;
            --warm-charcoal: #3A2E2A;

            /* 渐变 */
            --bg-gradient: linear-gradient(180deg, var(--warm-beige-0) 0%, var(--warm-beige-1) 100%);
            --gold-gradient: linear-gradient(135deg, var(--champagne-gold-0) 0%, var(--champagne-gold-1) 100%);
            --pink-gradient: linear-gradient(135deg, var(--blush-pink-0) 0%, var(--blush-pink-1) 100%);

            /* 字体系统 */
            --font-serif: 'Times New Roman', Georgia, serif;
            --font-sans: 'Helvetica Neue', Arial, sans-serif;

            /* 间距 */
            --base-unit: 8px;
            --spacing-min: 12px;
            --spacing-headline-bottle: 20px;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: #e8ddd0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
        }

        /* ===== 画布容器 ===== */
        .canvas {
            position: relative;
            width: 800px;
            height: 1200px;
            background: var(--bg-gradient);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(60, 40, 30, 0.18);
            flex-shrink: 0;
        }

        /* ===== 通用图片槽位占位 ===== */
        [data-image-slot] {
            display: block;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ===== Hero Header (3/5) ===== */
        .hero-header {
            position: relative;
            width: 100%;
            height: 720px;
            /* 3/5 of 1200 */
            background: var(--bg-gradient);
            overflow: hidden;
        }

        /* 背景图槽位 — 全幅 */
        .bg-slot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            /* 模拟大理石纹理的微噪点 */
            background-image:
                radial-gradient(circle at 30% 40%, rgba(255, 248, 240, 0.40) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(220, 195, 170, 0.20) 0%, transparent 50%),
                var(--bg-gradient);
            z-index: 1;
            pointer-events: none;
        }

        /* 右上角金色光晕装饰 */
        .bg-glow {
            position: absolute;
            top: -80px;
            right: -60px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle at 50% 50%,
                    rgba(212, 175, 55, 0.12) 0%,
                    rgba(232, 200, 114, 0.06) 40%,
                    transparent 70%);
            z-index: 2;
            pointer-events: none;
            border-radius: 50%;
        }

        /* 品牌 Logo — 左上角 */
        .brand-logo {
            position: absolute;
            top: 72px;
            /* 约 9% */
            left: 72px;
            /* 约 9% */
            width: 120px;
            height: 40px;
            background: var(--gold-gradient);
            border-radius: 2px;
            z-index: 10;
            opacity: 0.92;
            /* 占位：模拟 Logo 图形 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--warm-charcoal);
            line-height: 1;
        }
        .brand-logo::after {
            content: 'LUMINA';
            opacity: 0.7;
            font-size: 14px;
            letter-spacing: 0.2em;
        }

        /* 标题区域 — 居中，垂直约 30% */
        .headline-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* 实际通过 top 微调 */
            top: 28%;
            width: 90%;
            max-width: 680px;
            text-align: center;
            z-index: 8;
        }

        .headline {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.2;
            color: var(--champagne-gold-0);
            text-shadow: 0 2px 20px rgba(212, 175, 55, 0.15);
            white-space: nowrap;
            margin-bottom: 12px;
        }

        .subheadline {
            font-family: var(--font-sans);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.12em;
            line-height: 1.5;
            color: var(--soft-white);
            text-shadow: 0 1px 12px rgba(60, 40, 30, 0.10);
            white-space: nowrap;
        }

        /* ===== 产品瓶身 ===== */
        .product-bottle-wrapper {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) rotate(12deg);
            z-index: 5;
            /* 框样式: product-hero-frame */
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(180, 140, 100, 0.20);
            overflow: hidden;
            width: 210px;
            height: 310px;
            background: linear-gradient(160deg,
                    rgba(255, 252, 248, 0.55) 0%,
                    rgba(245, 235, 225, 0.30) 40%,
                    rgba(220, 200, 180, 0.25) 70%,
                    rgba(200, 180, 160, 0.15) 100%);
            backdrop-filter: blur(2px);
            /* 模拟通透瓶身 */
            transition: transform 0.1s ease;
            pointer-events: none;
        }

        /* 产品瓶身图片槽位 */
        .product-slot {
            width: 100%;
            height: 100%;
            background: linear-gradient(170deg,
                    rgba(255, 248, 240, 0.60) 0%,
                    rgba(235, 218, 200, 0.35) 45%,
                    rgba(210, 188, 168, 0.20) 75%,
                    rgba(190, 168, 148, 0.10) 100%);
            background-blend-mode: overlay;
            position: relative;
        }

        /* 瓶身高光线条 — 左侧细长高光 */
        .product-slot::before {
            content: '';
            position: absolute;
            top: 12%;
            left: 8%;
            width: 6px;
            height: 62%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.50) 0%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, 0) 100%);
            border-radius: 3px;
            filter: blur(1px);
            pointer-events: none;
        }

        /* 瓶身底部微光 */
        .product-slot::after {
            content: '';
            position: absolute;
            bottom: 6%;
            left: 15%;
            width: 70%;
            height: 20px;
            background: radial-gradient(ellipse at center,
                    rgba(212, 175, 55, 0.08) 0%,
                    transparent 70%);
            pointer-events: none;
        }

        /* ===== CTA Section (2/5) ===== */
        .cta-section {
            position: relative;
            width: 100%;
            height: 480px;
            /* 2/5 of 1200 */
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 60px 40px;
            /* 底部留白 */
            z-index: 3;
        }

        /* 标签 — 胶囊形 */
        .tag {
            display: inline-block;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.1em;
            line-height: 1;
            color: var(--soft-white);
            background: var(--pink-gradient);
            border-radius: 20px;
            padding: 6px 18px;
            border: 1px solid rgba(212, 175, 55, 0.30);
            margin-bottom: 16px;
            /* 与正文间距 */
            text-align: center;
            white-space: nowrap;
        }

        /* 正文 */
        .body-text {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.04em;
            line-height: 1.6;
            color: var(--warm-charcoal);
            text-align: center;
            max-width: 520px;
        }

        /* CTA 按钮 */
        .cta-button {
            display: inline-block;
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.06em;
            line-height: 1;
            color: var(--warm-charcoal);
            background: var(--gold-gradient);
            border-radius: 30px;
            padding: 12px 40px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.40);
            text-align: center;
            white-space: nowrap;
            cursor: default;
        }

        /* 促销信息 */
        .promo-info {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.2;
            text-align: center;
            margin-top: 12px;
        }

        /* ===== 微调装饰 — 分隔柔和过渡 ===== */
        .hero-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(180deg, transparent 0%, var(--warm-beige-1) 100%);
            z-index: 4;
            pointer-events: none;
            opacity: 0.3;
        }

        /* ===== 响应式适配（移动优先） ===== */
        @media (max-width: 840px) {
            .canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 800 / 1200;
                max-width: 800px;
                box-shadow: none;
                border-radius: 0;
            }

            .brand-logo {
                top: 6%;
                left: 6%;
                width: 100px;
                height: 34px;
            }
            .brand-logo::after {
                font-size: 12px;
            }

            .headline {
                font-size: clamp(24px, 4.5vw, 36px);
                white-space: normal;
            }
            .subheadline {
                font-size: clamp(14px, 2.2vw, 18px);
                white-space: normal;
            }

            .product-bottle-wrapper {
                width: 160px;
                height: 240px;
                bottom: 40px;
            }

            .cta-section {
                padding: 0 30px 30px;
            }

            .body-text {
                font-size: clamp(12px, 1.8vw, 14px);
                max-width: 90%;
            }

            .tag {
                font-size: 12px;
                padding: 5px 14px;
            }

            .cta-button {
                font-size: 14px;
                padding: 10px 32px;
            }

            .promo-info {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .brand-logo {
                top: 4%;
                left: 4%;
                width: 72px;
                height: 26px;
            }
            .brand-logo::after {
                font-size: 9px;
                letter-spacing: 0.15em;
            }

            .headline-area {
                top: 24%;
            }
            .headline {
                font-size: 20px;
                letter-spacing: 0.06em;
            }
            .subheadline {
                font-size: 13px;
                letter-spacing: 0.08em;
            }

            .product-bottle-wrapper {
                width: 110px;
                height: 170px;
                bottom: 30px;
                border-radius: 6px;
            }

            .cta-section {
                padding: 0 16px 24px;
            }
            .tag {
                font-size: 11px;
                padding: 4px 12px;
                border-radius: 16px;
            }
            .body-text {
                font-size: 11px;
                margin-bottom: 16px;
            }
            .cta-button {
                font-size: 13px;
                padding: 8px 24px;
                border-radius: 24px;
            }
            .promo-info {
                font-size: 10px;
                margin-top: 8px;
            }

            .bg-glow {
                width: 200px;
                height: 200px;
                top: -40px;
                right: -30px;
            }
        }

        /* 确保在固定宽高容器内文字不被挤压 */
        @media (max-width: 800px) {
            .canvas {
                aspect-ratio: 800 / 1200;
                height: auto;
                min-height: 100vh;
                min-height: 100dvh;
            }
            .hero-header {
                height: 60%;
            }
            .cta-section {
                height: 40%;
            }
        }

        /* 对于不支持 aspect-ratio 的浏览器降级 */
        @supports not (aspect-ratio: 800 / 1200) {
            @media (max-width: 840px) {
                .canvas {
                    height: 150vw;
                    min-height: 500px;
                }
            }
        }
    </style>
</head>
<body>

    <!-- ===== 画布容器 ===== -->
    <div class="canvas">

        <!-- ===== HERO HEADER (3/5) ===== -->
        <header class="hero-header">

            <!-- 背景图片槽位 -->
            <img src="D:\desktop\vinart\test\output\bg-full.png"
            data-vinart-type="image-slot" data-vinart-id="bg-full"
            data-image-slot="bg-full"
            alt="background"
            style="width:800px;height:720px;object-fit:cover;" />

            <!-- 右上角金色光晕装饰 -->
            <div class="bg-glow" aria-hidden="true"></div>

            <!-- 品牌 Logo 图片槽位 -->
            <div class="brand-logo" data-vinart-type="image-slot" data-vinart-id="brand-logo" data-image-slot="brand-logo" role="img" aria-label="品牌Logo"></div>

            <!-- 标题区域 -->
            <div class="headline-area">
                <h1 class="headline" data-vinart-type="headline" data-vinart-id="main-title">7天 焕亮你的光</h1>
                <p class="subheadline" data-vinart-type="subheadline" data-vinart-id="main-subtitle">安心焕亮，温柔可见</p>
            </div>

            <!-- 产品瓶身图片槽位（带框样式） -->
            <div class="product-bottle-wrapper">
                <div class="product-slot" data-vinart-type="image-slot" data-vinart-id="product-hero" data-image-slot="product-hero" role="img" aria-label="焕亮精华液瓶身特写"></div>
            </div>

        </header>

        <!-- ===== CTA SECTION (2/5) ===== -->
        <section class="cta-section">

            <!-- 标签 -->
            <span class="tag" data-vinart-type="tag" data-vinart-id="feature-tag">温和不刺激</span>

            <!-- 正文 -->
            <p class="body-text" data-vinart-type="body" data-vinart-id="main-body">润透无负担，7天告别暗沉。敏感肌挚爱，温和焕亮新配方。</p>

            <!-- CTA 按钮 -->
            <span class="cta-button" data-vinart-type="cta" data-vinart-id="explore-btn">探索光泽</span>

            <!-- 促销信息 -->
            <span class="promo-info" data-vinart-type="price" data-vinart-id="promo-price">首发价¥288</span>

        </section>

    </div>
    <!-- ===== 画布结束 ===== -->

</body>
</html>
