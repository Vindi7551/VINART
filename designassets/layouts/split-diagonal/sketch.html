<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><style>
  
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2000px;height:2000px}
  body{font-family:'Bookman Old Style', Georgia, "Times New Roman", serif}
  /* 画布本身不设背景色——拆层时要把它中性化，这样每层能独立截出。
     背景素材由 image / splitBackground 图层负责。 */
  .canvas{position:relative;width:2000px;height:2000px;overflow:hidden}

  /* 图层容器：绝对定位、不带 z-index —— DOM 顺序即叠放顺序。
     ★ isolation:isolate 是必需的，不是装饰：
     实测（scripts/_probe-zindex.ts）——若容器不创建层叠上下文，
     **容器内部的 z-index 会逃出来跟兄弟图层比较**，静默地跑到别的图层上面。
     加上它之后，内部 z-index 只在层内生效，层与层之间始终按 DOM 顺序。 */
  .dl{position:absolute;isolation:isolate}

  .bgbox{position:absolute;overflow:hidden}
  .bgbox img{width:100%;height:100%;object-fit:cover;display:block}

  /* 笔刷横幅的文字层 */
  .bt{display:flex;align-items:center;color:#FFFFFF;
      font-family:'Bookman Old Style', Georgia, "Times New Roman", serif;font-weight:700;
      letter-spacing:0em;text-shadow:0 2px 10px rgba(0,0,0,.35)}

  /* 副文案 */
  .sub{font-family:'Bookman Old Style', Georgia, "Times New Roman", serif;
       letter-spacing:0em;text-shadow:0 2px 9px rgba(0,0,0,.62)}

  /* 小黑标签 */
  .tab{display:flex;align-items:center;background:rgba(12,8,4,.92);color:#FFFFFF;
       font-family:'Bookman Old Style', Georgia, "Times New Roman", serif;font-weight:400;
       letter-spacing:.06em;text-transform:uppercase;padding:0 24px;
       border-radius:2px}

  /* 徽章 */
  .bdg{border-radius:50%;display:flex;align-items:center;justify-content:center}
  .btxt{color:#F2E8DA;font-family:'Bookman Old Style', Georgia, "Times New Roman", serif;font-weight:400;
        text-shadow:0 2px 9px rgba(0,0,0,.6)}

  /* 圆形细节图的标注 */
  .cin-caption{color:#F2E8DA;font-family:'Bookman Old Style', Georgia, "Times New Roman", serif;font-weight:400;
               text-shadow:0 2px 9px rgba(0,0,0,.7)}
  
  .sbg{position:absolute;inset:0;background:#EDEDED}
  .sbg2{position:absolute;inset:0;background:#E2E2E2}
  .sbg3{position:absolute;inset:0;background:#F4F4F4}
  .sscrim{background:rgba(150,162,175,.28)}
  /* ⚠️ 压暗层的草图标记**不能用斜线纹理**：文字占位条是浅灰（#C4C9CE），
     压在纹理上和底色混成一片，顶部几条文字条就看不见了（实测踩过）。
     用极淡的纯色块，只表达"这里有一层"，不抢戏。 */
  .sbox{position:absolute;border:3px dashed #9199A1}
  .sslot{position:absolute;border:4px dashed #6E7780;background:rgba(255,255,255,.38);
         display:flex;align-items:center;justify-content:center;border-radius:8px}
  .sslot span{font-family:Arial,sans-serif;font-size:38px;font-weight:700;color:#4A5158;letter-spacing:.12em}
  .sbar{position:absolute;background:#C4C9CE;border-radius:4px}
  .scirc{position:absolute;border:4px dashed #9199A1;border-radius:50%}
  .slbl{position:absolute;font-family:Arial,sans-serif;font-size:26px;font-weight:700;
        color:#5F6368;background:rgba(255,255,255,.9);padding:4px 11px;letter-spacing:.05em;white-space:nowrap}
  
</style></head><body><div class="canvas">
